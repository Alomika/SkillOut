name: Cypress SD-59 Tests

on:
  push:
    branches:
      - SD-59-as-kaip-studentas-noriu-pasirinkti-studiju-dalyk
  pull_request:
    branches:
      - SD-59-as-kaip-studentas-noriu-pasirinkti-studiju-dalyk

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-sd-59-results
          path: cypress/results/