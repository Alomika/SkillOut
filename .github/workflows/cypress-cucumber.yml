name: Cypress Cucumber E2E

on:
  push:
  pull_request:

jobs:
  cypress-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Cypress (headless, Gherkin)
        run: npm run cy:run:gherkin
